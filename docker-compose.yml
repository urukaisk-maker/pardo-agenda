version: "3.8"

services:
  frontend:
    build: ./frontend
    container_name: pardo-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - pardo-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pardo-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://pardo:pardo2024@postgres:5432/pardodb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=pardo_secret_key_2024
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - pardo-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pardo-postgres
    environment:
      - POSTGRES_DB=pardodb
      - POSTGRES_USER=pardo
      - POSTGRES_PASSWORD=pardo2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pardo-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pardo-redis
    ports:
      - "6379:6379"
    networks:
      - pardo-network
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: pardo-adminer
    ports:
      - "8081:8080"
    networks:
      - pardo-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: pardo_postgres_data

networks:
  pardo-network:
    driver: bridge
    name: pardo_network
