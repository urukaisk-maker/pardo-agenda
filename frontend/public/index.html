<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Pardo Agenda - Tu mascota virtual te ayuda a organizarte">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pardo">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icons/icon.svg">
    <title>🐕 Pardo Agenda</title>
</head>
<body>
    <div id="root"></div>
    <noscript>Necesitas JavaScript para usar Pardo Agenda</noscript>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/service-worker.js")
                    .then(() => console.log("✅ Service Worker registrado"))
                    .catch((err) => console.log("Error SW:", err));
            });
        }
    </script>
</body>
</html>
